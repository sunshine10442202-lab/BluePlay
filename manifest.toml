schema-version = 1

[package]
title = "BluePlay"
version = "0.1.0"
# Increase build-number for every Appstore upload.
build-number = 1
id = "com.shanjay.blueplay"

[os.version]
min = "2.0"
target = "2.0"

[needs]
[wants]
[[wants.module]]
id = "/com.amazon.kepler.net.net_manager@INetManager"

[components]
[[components.interactive]]
id = "com.shanjay.blueplay.main"
runtime-module = "/com.amazon.kepler.runtime.react_native_kepler_4@IReactNativeKepler_0"
launch-type = "singleton"
categories = ["com.amazon.category.main"]
